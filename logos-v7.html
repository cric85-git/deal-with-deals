<!doctype html>
<html><head><meta charset="utf-8" />
<title>Perq · Rounded P variations</title>
<style>
body{margin:0;background:#020817;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:32px}
h1{text-align:center;letter-spacing:8px;font-weight:700;margin:0 0 8px}
.sub{text-align:center;color:#94a3b8;margin:0 auto 32px;max-width:520px;font-size:13px;line-height:1.55}
.sub b{color:#39ffd0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1200px;margin:auto}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{text-align:center}
svg{width:180px;height:180px;border-radius:34px;display:block;margin:0 auto}
.num{color:#39ffd0;font-size:18px;margin-top:10px;font-weight:700}
.label{color:#64748b;font-size:11px;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
.foot{text-align:center;margin-top:48px;color:#94a3b8;font-size:14px;line-height:1.6}
.foot a{display:inline-block;background:linear-gradient(135deg,#10B981,#059669);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<h1>ROUNDED P</h1>
<p class="sub">Same wallet as v5 #3. Eight rounded letterforms — <b>circular bowls, soft stems, no sharp corners</b>. Pick the one that feels right for Perq.</p>
<div class="grid">

<script>
function tile(n, pSvg, label){
  const wallet = `
    <defs>
      <linearGradient id="bg${n}" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#082b6f"/><stop offset="1" stop-color="#020817"/>
      </linearGradient>
      <linearGradient id="mint${n}" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#9cffdf"/><stop offset="1" stop-color="#00c9a7"/>
      </linearGradient>
      <filter id="shadow${n}"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".35"/></filter>
    </defs>
    <rect width="512" height="512" rx="96" fill="url(#bg${n})"/>
    <rect x="150" y="105" width="210" height="130" rx="24" fill="url(#mint${n})" transform="rotate(-9 256 170)" opacity=".95"/>
    <text x="255" y="195" font-size="72" text-anchor="middle" font-weight="800" fill="white">$</text>
    <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178 V350 Q400 395 355 395 H157 Q112 395 112 350Z" fill="#071b4d" filter="url(#shadow${n})"/>
    <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178" fill="none" stroke="#174073" stroke-width="8"/>
    <rect x="350" y="245" width="58" height="78" rx="20" fill="#08265f"/>
    <circle cx="378" cy="284" r="13" fill="url(#mint${n})"/>
  `;
  return `<div class="card">
    <svg viewBox="0 0 512 512">${wallet}${pSvg}</svg>
    <div class="num">${n}</div>
    <div class="label">${label}</div>
  </div>`;
}

// Eight rounded P variations.
// All use circular/elliptical bowls and rounded stem corners — no sharp angles.
// Bounding box ~ x:215-320, y:210-345 inside the wallet.
const variations = [
  // 1. Bold Round — Avenir Heavy / Circular Std vibe — balanced thickness
  {
    label: 'Bold Round',
    p: `
      <rect x="220" y="215" width="32" height="130" rx="4" fill="#fff"/>
      <circle cx="278" cy="255" r="42" fill="#fff"/>
      <circle cx="278" cy="255" r="18" fill="#071b4d"/>
    `
  },
  // 2. Geometric Light — Futura-style — thin stem, perfect circle bowl, large counter
  {
    label: 'Geo Light',
    p: `
      <rect x="226" y="210" width="22" height="135" rx="2" fill="#fff"/>
      <circle cx="272" cy="250" r="40" fill="#fff"/>
      <circle cx="272" cy="250" r="22" fill="#071b4d"/>
    `
  },
  // 3. Tall Display — narrow vertical proportions, oval bowl
  {
    label: 'Tall Display',
    p: `
      <rect x="222" y="205" width="26" height="145" rx="8" fill="#fff"/>
      <ellipse cx="276" cy="258" rx="38" ry="44" fill="#fff"/>
      <ellipse cx="276" cy="258" rx="18" ry="22" fill="#071b4d"/>
    `
  },
  // 4. Pillow — very rounded stem, balloon-soft bowl
  {
    label: 'Pillow',
    p: `
      <rect x="215" y="215" width="38" height="130" rx="18" fill="#fff"/>
      <circle cx="278" cy="258" r="46" fill="#fff"/>
      <circle cx="278" cy="258" r="22" fill="#071b4d"/>
    `
  },
  // 5. Wide Bowl — egg-shaped, slightly wider than tall
  {
    label: 'Wide Bowl',
    p: `
      <rect x="220" y="215" width="30" height="130" rx="6" fill="#fff"/>
      <ellipse cx="280" cy="248" rx="46" ry="40" fill="#fff"/>
      <ellipse cx="280" cy="248" rx="22" ry="18" fill="#071b4d"/>
    `
  },
  // 6. Heavy Black — chunky thick everything, small counter (Helvetica Black vibe)
  {
    label: 'Heavy Black',
    p: `
      <rect x="212" y="215" width="46" height="130" rx="6" fill="#fff"/>
      <circle cx="290" cy="255" r="44" fill="#fff"/>
      <circle cx="290" cy="255" r="14" fill="#071b4d"/>
    `
  },
  // 7. Sofia — refined balanced geometric (Sofia Pro / Brandon Grotesque)
  {
    label: 'Sofia',
    p: `
      <rect x="222" y="215" width="30" height="130" rx="2" fill="#fff"/>
      <circle cx="276" cy="252" r="40" fill="#fff"/>
      <circle cx="276" cy="252" r="20" fill="#071b4d"/>
    `
  },
  // 8. Open Counter — exaggerated inner hole, emphasizes negative space
  {
    label: 'Open Counter',
    p: `
      <rect x="220" y="215" width="28" height="130" rx="4" fill="#fff"/>
      <circle cx="278" cy="255" r="44" fill="#fff"/>
      <circle cx="278" cy="255" r="28" fill="#071b4d"/>
    `
  }
];

document.write(variations.map((v, i) => tile(i+1, v.p, v.label)).join(""));
</script>
</div>

<div class="foot">
  <p>Pick a number — say <b style="color:#39ffd0">"go with #N"</b> — and I'll wire it through as the real app icon.</p>
  <a href="preview.html?v=20">← Back to app</a>
</div>

</body></html>
