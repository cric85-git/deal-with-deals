<!doctype html>
<html><head><meta charset="utf-8" />
<title>Perq Logo Concepts</title>
<style>
body{margin:0;background:#020817;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:32px}
h1{text-align:center;letter-spacing:8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;max-width:1200px;margin:auto}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:18px}}
.card{text-align:center}
svg{width:180px;height:180px;border-radius:34px}
.num{color:#39ffd0;font-size:22px;margin-top:8px}
.foot{text-align:center;margin-top:48px;color:#94a3b8;font-size:14px;line-height:1.6}
.foot a{display:inline-block;background:linear-gradient(135deg,#10B981,#059669);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<h1>PERQ WALLET ICONS</h1>
<div class="grid">
<script>
const icons = Array.from({length:15},(_,i)=>i+1);
function icon(n){
return `<div class="card"><svg viewBox="0 0 512 512"><defs><linearGradient id="bg${n}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082b6f"/><stop offset="1" stop-color="#020817"/></linearGradient><linearGradient id="mint${n}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9cffdf"/><stop offset="1" stop-color="#00c9a7"/></linearGradient><filter id="shadow${n}"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".35"/></filter></defs><rect width="512" height="512" rx="96" fill="url(#bg${n})"/>${n % 3 === 0
? `<rect x="150" y="105" width="210" height="130" rx="24" fill="url(#mint${n})" transform="rotate(-9 256 170)" opacity=".95"/><text x="255" y="195" font-size="72" text-anchor="middle" font-weight="800" fill="white">$</text>`
: `<rect x="155" y="92" width="205" height="140" rx="24" fill="url(#mint${n})" transform="rotate(-10 256 160)" opacity=".95"/>`
}${n % 4 === 0
? `<path d="M118 170 H380 Q405 170 405 195 V345 Q405 390 360 390 H152 Q108 390 108 345 V195 Q108 170 118 170Z" fill="none" stroke="url(#mint${n})" stroke-width="18" stroke-linejoin="round"/><path d="M190 235 H295 Q330 235 330 270 Q330 305 295 305 H215 V365" fill="none" stroke="url(#mint${n})" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>`
: `<path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178 V350 Q400 395 355 395 H157 Q112 395 112 350Z" fill="#071b4d" filter="url(#shadow${n})"/><path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178" fill="none" stroke="#174073" stroke-width="8"/><rect x="350" y="245" width="58" height="78" rx="20" fill="#08265f"/><circle cx="378" cy="284" r="13" fill="url(#mint${n})"/>`
}${n % 5 === 0
? `<text x="256" y="318" font-size="150" text-anchor="middle" font-weight="850" fill="url(#mint${n})">P</text><text x="315" y="330" font-size="78" font-weight="850" fill="url(#mint${n})">$</text>`
: n % 2 === 0
? `<path d="M170 335 V180 H280 Q345 180 345 238 Q345 296 280 296 H215 L170 335Z" fill="url(#mint${n})"/><path d="M215 225 H280 Q300 225 300 240 Q300 255 280 255 H215Z" fill="#071b4d"/>`
: `<text x="250" y="330" font-size="170" text-anchor="middle" font-weight="850" fill="white">P</text>`
}</svg><div class="num">${n}</div></div>`;
}
document.write(icons.map(icon).join(""));
</script>
</div>

<div class="foot">
  <p>Pick your favorite number and tell me — I'll wire it through the app as the real icon.</p>
  <a href="preview.html?v=20">← Back to app</a>
</div>

</body></html>
