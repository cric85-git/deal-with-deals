<!doctype html>
<html><head><meta charset="utf-8" />
<title>Perq · Ribbon-curl P variations</title>
<style>
body{margin:0;background:#020817;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:32px}
h1{text-align:center;letter-spacing:8px;font-weight:700;margin:0 0 8px;font-size:22px}
.sub{text-align:center;color:#94a3b8;margin:0 auto 32px;max-width:520px;font-size:13px;line-height:1.55}
.sub b{color:#39ffd0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1200px;margin:auto}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{text-align:center}
svg{width:180px;height:180px;border-radius:34px;display:block;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.num{color:#39ffd0;font-size:18px;margin-top:10px;font-weight:700}
.label{color:#64748b;font-size:11px;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
.foot{text-align:center;margin-top:48px;color:#94a3b8;font-size:14px;line-height:1.6}
.foot a{display:inline-block;background:linear-gradient(135deg,#10B981,#059669);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<h1>RIBBON-CURL P</h1>
<p class="sub">Heavy rounded P with a distinctive flourish at the top of the bowl — same family as the reference Concept 5 you liked. Eight variations on the same wallet.</p>
<div class="grid">

<script>
function tile(n, pSvg, label){
  return `<div class="card">
    <svg viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg${n}" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#082b6f"/><stop offset="1" stop-color="#020817"/>
        </linearGradient>
        <linearGradient id="mint${n}" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#9cffdf"/><stop offset="1" stop-color="#00c9a7"/>
        </linearGradient>
        <linearGradient id="leafGrad${n}" x1="0" y1="0" x2="0.6" y2="1">
          <stop stop-color="#9cffdf"/>
          <stop offset="0.5" stop-color="#34D399"/>
          <stop offset="1" stop-color="#047857"/>
        </linearGradient>
        <filter id="shadow${n}"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".35"/></filter>
      </defs>
      <rect width="512" height="512" rx="96" fill="url(#bg${n})"/>
      <rect x="150" y="105" width="210" height="130" rx="24" fill="url(#mint${n})" transform="rotate(-9 256 170)" opacity=".95"/>
      <text x="255" y="195" font-size="72" text-anchor="middle" font-weight="800" fill="white">$</text>
      <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178 V350 Q400 395 355 395 H157 Q112 395 112 350Z" fill="#071b4d" filter="url(#shadow${n})"/>
      <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178" fill="none" stroke="#174073" stroke-width="8"/>
      <rect x="350" y="245" width="58" height="78" rx="20" fill="#08265f"/>
      <circle cx="378" cy="284" r="13" fill="url(#mint${n})"/>
      ${pSvg(n)}
    </svg>
    <div class="num">${n}</div>
    <div class="label">${label}</div>
  </div>`;
}

// Eight variations of the heavy-rounded P with a "leaf curl" flourish at the top of the bowl.
// All use the leafGrad gradient (light mint top -> emerald bottom) for that 3D depth feel.
const variations = [
  // 1. Classic Curl — base reference style: thick stem, bowl with a small leaf-fold at top-right
  {
    label: 'Classic Curl',
    p: (n) => `
      <!-- Stem -->
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <!-- Bowl with leaf curl at top -->
      <path d="M243 215 H280 Q318 215 322 245 Q322 255 314 255 Q316 235 296 235 H243 Z M243 235 H296 Q310 235 314 245 Q314 270 290 270 H243 Z" fill="url(#leafGrad${n})"/>
      <!-- Bowl body -->
      <path d="M243 215 H290 Q325 215 325 250 Q325 285 290 285 H243 Z" fill="url(#leafGrad${n})"/>
      <!-- Inner counter -->
      <path d="M243 232 H285 Q307 232 307 250 Q307 268 285 268 H243 Z" fill="#071b4d"/>
      <!-- Leaf curl (the signature flourish) -->
      <path d="M295 215 Q325 207 322 240 Q310 232 295 235 Z" fill="#9cffdf" opacity="0.95"/>
    `
  },
  // 2. Big Leaf — exaggerated leaf flourish, larger and more curl
  {
    label: 'Big Leaf',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 215 H285 Q325 215 325 250 Q325 285 285 285 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 232 H280 Q307 232 307 250 Q307 268 280 268 H243 Z" fill="#071b4d"/>
      <!-- Big leaf curl extending above bowl -->
      <path d="M285 215 Q335 200 330 252 Q310 230 290 232 Z" fill="#9cffdf" opacity="0.92"/>
      <path d="M285 215 Q330 205 322 240 Z" fill="url(#mint${n})" opacity="0.7"/>
    `
  },
  // 3. Subtle Tip — minimal flourish, just a small peak on the right of the bowl
  {
    label: 'Subtle Tip',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 215 H290 Q325 215 325 250 Q325 285 290 285 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 232 H285 Q307 232 307 250 Q307 268 285 268 H243 Z" fill="#071b4d"/>
      <!-- Subtle peak at top-right -->
      <path d="M310 215 Q325 207 322 232 Q317 222 310 222 Z" fill="#9cffdf" opacity="0.95"/>
    `
  },
  // 4. Wave — flowing wave-like flourish across the entire top of the bowl
  {
    label: 'Wave',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 220 H290 Q325 220 325 252 Q325 285 290 285 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 235 H285 Q307 235 307 252 Q307 268 285 268 H243 Z" fill="#071b4d"/>
      <!-- Wavy ribbon across top -->
      <path d="M243 220 Q260 200 290 215 Q310 205 325 220 Q310 230 290 222 Q265 232 243 222 Z" fill="#9cffdf" opacity="0.9"/>
    `
  },
  // 5. Folded Corner — top of bowl looks like paper folded over
  {
    label: 'Folded',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 215 H290 Q325 215 325 250 Q325 285 290 285 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 232 H285 Q307 232 307 250 Q307 268 285 268 H243 Z" fill="#071b4d"/>
      <!-- Folded paper effect -->
      <polygon points="305,215 325,215 325,237" fill="#9cffdf"/>
      <polygon points="305,215 325,237 312,228" fill="#34D399" opacity="0.7"/>
    `
  },
  // 6. Banner — flag-like flourish with two points
  {
    label: 'Banner',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 220 H290 Q325 220 325 252 Q325 285 290 285 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 236 H285 Q307 236 307 252 Q307 268 285 268 H243 Z" fill="#071b4d"/>
      <!-- Banner with V-cut tip -->
      <path d="M275 200 H320 L312 215 L320 230 H275 L283 215 Z" fill="#9cffdf" opacity="0.95"/>
    `
  },
  // 7. Sprout — leaf flourish that sprouts up like a plant leaf
  {
    label: 'Sprout',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 220 H290 Q325 220 325 252 Q325 285 290 285 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 236 H285 Q307 236 307 252 Q307 268 285 268 H243 Z" fill="#071b4d"/>
      <!-- Sprout leaf shooting up -->
      <path d="M300 220 Q322 195 332 220 Q325 215 318 220 Q310 215 300 220 Z" fill="#9cffdf"/>
      <path d="M310 200 Q318 200 318 215 Q314 210 310 215 Z" fill="#34D399" opacity="0.6"/>
    `
  },
  // 8. Ribbon — bowl appears to be a ribbon wrapping with a fold
  {
    label: 'Ribbon',
    p: (n) => `
      <path d="M205 215 Q205 207 213 207 H235 Q243 207 243 215 V338 Q243 346 235 346 H213 Q205 346 205 338 Z" fill="url(#leafGrad${n})"/>
      <!-- Bowl as ribbon -->
      <path d="M243 215 H300 Q330 215 330 252 Q330 290 290 290 H243 Z" fill="url(#leafGrad${n})"/>
      <path d="M243 232 H290 Q310 232 310 252 Q310 270 285 270 H243 Z" fill="#071b4d"/>
      <!-- Ribbon fold detail -->
      <path d="M295 215 L325 215 L320 225 L300 230 Z" fill="#34D399" opacity="0.85"/>
      <path d="M325 215 Q335 215 330 235 Q325 222 320 222 Z" fill="#9cffdf"/>
    `
  }
];

document.write(variations.map((v, i) => tile(i+1, v.p, v.label)).join(""));
</script>
</div>

<div class="foot">
  <p>Pick a number — say <b style="color:#39ffd0">"go with #N"</b> — and I'll wire it through as the real app icon.</p>
  <a href="preview.html?v=20">← Back to app</a>
</div>

</body></html>
