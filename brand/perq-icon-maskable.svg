<?xml version="1.0" encoding="UTF-8"?>
<!--
  Perq maskable icon · Navy + Mint
  Full-bleed navy background. Logo content scaled into ~80% safe zone (PWA maskable spec).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#06111C"/>
    </linearGradient>
    <linearGradient id="pocket-grad-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8F6"/>
    </linearGradient>
    <linearGradient id="bill-grad-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="word-grad-m" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="bill-shadow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inner-shadow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed navy (no rounding — OS will mask) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad-m)"/>

  <!-- Logo group scaled 0.78 around center for safe zone -->
  <g transform="translate(56,56) scale(0.78)">
    <g filter="url(#bill-shadow-m)">
      <path d="M218 84 L344 84 Q358 84 358 98 L358 210 Q358 232 336 232 L240 232 Q218 232 218 210 Z"
            fill="url(#bill-grad-m)"/>
      <path d="M218 84 L358 84 L358 100 L218 100 Z" fill="rgba(255,255,255,0.18)"/>
      <path d="M218 84 L344 84 Q358 84 358 98 L358 210 Q358 232 336 232 L240 232 Q218 232 218 210 Z"
            fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>
      <text x="288" y="184" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
            font-size="84" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>
    </g>
    <g filter="url(#inner-shadow-m)">
      <path d="M88 200 L88 396 Q88 422 114 422 L398 422 Q424 422 424 396 L424 200
               Q424 168 392 158 L256 134 L120 158 Q88 168 88 200 Z"
            fill="url(#pocket-grad-m)"/>
    </g>
    <path d="M122 222 L122 388 Q122 400 134 400 L378 400 Q390 400 390 388 L390 222
             Q390 200 366 192 L256 170 L146 192 Q122 200 122 222 Z"
          fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    <text x="256" y="346" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
          font-size="92" font-weight="900" fill="url(#word-grad-m)" text-anchor="middle"
          letter-spacing="-3">Perq</text>
  </g>
</svg>
