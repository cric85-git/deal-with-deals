<?xml version="1.0" encoding="UTF-8"?>
<!--
  Perq maskable icon — full-bleed navy + content scaled to 80% PWA safe zone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#082b6f"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="mintM" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cffdf"/>
      <stop offset="1" stop-color="#00c9a7"/>
    </linearGradient>
    <filter id="walletShadowM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed navy (no rounding — OS masks) -->
  <rect width="512" height="512" fill="url(#bgM)"/>

  <!-- Logo group scaled 0.78 around center for safe zone -->
  <g transform="translate(56,56) scale(0.78)">
    <rect x="150" y="105" width="210" height="130" rx="24" fill="url(#mintM)" transform="rotate(-9 256 170)" opacity="0.95"/>
    <text x="255" y="195" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" text-anchor="middle">$</text>
    <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178 V350 Q400 395 355 395 H157 Q112 395 112 350 Z" fill="#071b4d" filter="url(#walletShadowM)"/>
    <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178" fill="none" stroke="#174073" stroke-width="8"/>
    <rect x="350" y="245" width="58" height="78" rx="20" fill="#08265f"/>
    <circle cx="378" cy="284" r="13" fill="url(#mintM)"/>
    <rect x="200" y="225" width="40" height="150" rx="6" fill="#FFFFFF"/>
    <circle cx="280" cy="270" r="48" fill="#FFFFFF"/>
    <circle cx="284" cy="270" r="20" fill="#071b4d"/>
  </g>
</svg>
