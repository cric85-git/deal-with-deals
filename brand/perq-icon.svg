<?xml version="1.0" encoding="UTF-8"?>
<!--
  Perq app icon — Mint Wallet theme (logos-v9 #2)
  Source of truth — render PNGs via scripts/build-icons.js
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#082b6f"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="claspDot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="walletShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Navy rounded tile -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Card peeking from behind, with $ -->
  <rect x="150" y="105" width="210" height="130" rx="24" fill="url(#card)" transform="rotate(-9 256 170)" opacity="0.95"/>
  <text x="255" y="195" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="72" font-weight="800" fill="#0F172A" text-anchor="middle">$</text>

  <!-- Mint wallet body -->
  <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178 V350 Q400 395 355 395 H157 Q112 395 112 350 Z" fill="url(#wallet)" filter="url(#walletShadow)"/>
  <path d="M112 178 Q112 145 145 145 H367 Q400 145 400 178" fill="none" stroke="#065F46" stroke-width="8"/>

  <!-- Clasp pocket on right (dark navy slot with amber dot) -->
  <rect x="350" y="245" width="58" height="78" rx="20" fill="#0F172A"/>
  <circle cx="378" cy="284" r="13" fill="url(#claspDot)"/>
</svg>
